<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Electrical work illustration">
  <rect width="200" height="150" fill="#FFF0CC"/>
  <!-- Switch panel -->
  <rect x="54" y="30" width="92" height="90" rx="14" fill="#FFFFFF" stroke="#E0CDA0" stroke-width="2"/>
  <!-- Switch 1 on -->
  <rect x="70" y="50" width="26" height="44" rx="8" fill="#F0E4B8"/>
  <rect x="75" y="52" width="16" height="22" rx="5" fill="#8AAF68"/>
  <!-- Switch 2 off -->
  <rect x="104" y="50" width="26" height="44" rx="8" fill="#F0E4B8"/>
  <rect x="109" y="72" width="16" height="20" rx="5" fill="#D0C090"/>
  <!-- Lightning bolt -->
  <path d="M98 18 L88 38 L96 38 L86 58 L102 34 L94 34 Z" fill="#F5C840" stroke="#C8A020" stroke-width="1" stroke-linejoin="round"/>
  <!-- Wires going to panel -->
  <path d="M20 75 Q40 75 54 65" fill="none" stroke="#7BA060" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M20 85 Q40 85 54 95" fill="none" stroke="#4A6A38" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Wire right -->
  <path d="M146 65 Q160 65 180 58" fill="none" stroke="#7BA060" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M146 95 Q160 95 180 102" fill="none" stroke="#4A6A38" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Dots -->
  <circle cx="20" cy="75" r="5" fill="#F5C840"/>
  <circle cx="20" cy="85" r="5" fill="#4A6A38"/>
</svg>
