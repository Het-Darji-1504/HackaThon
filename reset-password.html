<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#143D32">
  <meta name="description" content="Set a new password for your Work Satthi account.">
  <title>Reset password — Work Satthi</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page { grid-template-columns: 1fr; }
    .auth-panel { min-height: calc(100vh - 76px); }
    .auth-panel-inner { width: min(520px, 100%); margin-inline: auto; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav wrap" aria-label="Site navigation">
      <a class="brand" href="index.html" aria-label="Work Satthi home">
        <img class="brand-logo" src="logo.svg" alt="">
        <span class="brand-text">Work <em>Satthi</em></span>
      </a>
      <a class="nav-cta" href="login.html">← Back to login</a>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-panel" aria-label="Reset your password">
      <div class="auth-panel-inner">
        <div class="auth-card">
          <p class="eyebrow">Account recovery</p>
          <h2>Choose a new password</h2>
          <p class="auth-subtitle">Use at least 8 characters. Keep your new password private.</p>
          <form class="auth-form" id="reset-form">
            <div class="auth-field">
              <label for="new-password">New password</label>
              <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="At least 8 characters" required>
            </div>
            <div class="auth-field">
              <label for="confirm-password">Confirm new password</label>
              <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="Enter it again" required>
            </div>
            <button class="auth-submit" id="reset-submit" type="submit">Update password</button>
            <div class="auth-feedback" id="reset-feedback" role="status" aria-live="polite" aria-atomic="true"></div>
          </form>
          <a class="auth-home-link" href="login.html">← Return to login</a>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    (function () {
      'use strict';
      const form = document.getElementById('reset-form');
      const password = document.getElementById('new-password');
      const confirmPassword = document.getElementById('confirm-password');
      const submit = document.getElementById('reset-submit');
      const feedback = document.getElementById('reset-feedback');
      const client = window.supabase.createClient(
        window.WORK_SATTHI_SUPABASE_URL,
        window.WORK_SATTHI_SUPABASE_KEY,
        { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
      );

      function message(text, type) {
        feedback.textContent = text;
        feedback.classList.remove('is-error', 'is-success');
        if (type) feedback.classList.add(type);
      }

      let recoverySessionReady = false;
      client.auth.onAuthStateChange(function (event, session) {
        if (event === 'PASSWORD_RECOVERY' && session) {
          recoverySessionReady = true;
          message('Reset link verified. Enter your new password below.', 'is-success');
        }
      });

      client.auth.getSession().then(function (result) {
        if (result.error) {
          message('Could not verify the reset link. Request a new password-reset email.', 'is-error');
          return;
        }
        if (result.data.session) {
          recoverySessionReady = true;
          message('Reset link verified. Enter your new password below.', 'is-success');
        } else if (!window.location.hash && !new URLSearchParams(window.location.search).has('code')) {
          message('Open this page using the password-reset link sent to your email.', 'is-error');
        }
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        if (password.value.length < 8) {
          message('Your password must be at least 8 characters.', 'is-error');
          return;
        }
        if (password.value !== confirmPassword.value) {
          message('The passwords do not match. Please try again.', 'is-error');
          return;
        }
        submit.disabled = true;
        submit.textContent = 'Updating…';
        try {
          const { data: sessionData, error: sessionError } = await client.auth.getSession();
          if (sessionError) throw sessionError;
          if (!sessionData.session && !recoverySessionReady) {
            throw new Error('This reset link is missing or expired. Request a new password-reset email.');
          }
          const { error } = await client.auth.updateUser({ password: password.value });
          if (error) throw error;
          message('Password updated successfully. You can now log in with your new password.', 'is-success');
          password.value = '';
          confirmPassword.value = '';
          window.setTimeout(function () {
            window.location.href = 'login.html?password-reset=success';
          }, 1600);
        } catch (error) {
          message(error && error.message ? error.message : 'Could not update your password. Request a new reset link and try again.', 'is-error');
        } finally {
          submit.disabled = false;
          submit.textContent = 'Update password';
        }
      });
    }());
  </script>
</body>
</html>
